server.port=9090
spring.application.name=music-player-gateway

# ZITADEL OAuth2 Configuration
spring.security.oauth2.resourceserver.jwt.issuer-uri=https://musekit-oua2yk.us1.zitadel.cloud
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=https://musekit-oua2yk.us1.zitadel.cloud/oauth/v2/keys

# Spring Cloud Gateway Routes
spring.cloud.gateway.routes[0].id=swagger-ui-route
spring.cloud.gateway.routes[0].uri=http://localhost:8080
spring.cloud.gateway.routes[0].predicates[0]=Path=/swagger-ui/**, /swagger-ui.html, /v3/api-docs/**

spring.cloud.gateway.routes[1].id=uploads-route
spring.cloud.gateway.routes[1].uri=http://localhost:8080
spring.cloud.gateway.routes[1].predicates[0]=Path=/uploads/**

spring.cloud.gateway.routes[2].id=backend-api-route
spring.cloud.gateway.routes[2].uri=http://localhost:8080
spring.cloud.gateway.routes[2].predicates[0]=Path=/api/**

# Actuator
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always

# Logging
logging.level.org.springframework.cloud.gateway=INFO
logging.level.org.springframework.security=INFO
logging.level.com.musekit.gateway=DEBUG
